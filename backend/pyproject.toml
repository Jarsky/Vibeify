[project]
name = "vibeify"
version = "0.1.0"
description = "AI-curated Spotify playlists: describe what you want, an LLM picks the songs, Spotify gets the playlist."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.28",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
    "aiosmtplib>=3.0",
    "anthropic>=2.3,<3",
    "openai>=3.37,<4",
    "google-genai>=2.33,<3",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
