name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/pyproject.toml
    - name: Install dependencies
      run: pip install -e ".[dev]"
    - name: Lint
      run: ruff check --select F,E9 app tests
    - name: Tests
      run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: npm ci
    - name: Type check and build
      run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build image
      run: docker build -t vibeify:ci .
