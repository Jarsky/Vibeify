# Vibeify with PostgreSQL. Copy .env.example to .env, fill it in, then:  docker compose up -d
services:
  vibeify:
    image: vibeify:latest
    build: .
    container_name: vibeify
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vibeify}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vibeify}
    ports:
      - "${VIBEIFY_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: vibeify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibeify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vibeify}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
